<!DOCTYPE html>
<html lang="es">
<head>

    <title>Ejercicio 3</title>

        table {
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            color: white;
        }
        th {
            background-color: #5B402C;
        }
        td {

            color: #886F43;
        }

</head>
<body>

        </tr>
        <tr>
            <td>Con leche</td>
            <td>1.50 €</td>
        </tr>
        <tr>
            <td>Tostada</td>
            <td>Con aceite y tomate</td>

        </tr>
        <tr>
            <td>Zumo</td>

            <td>2.50 €</td>
        </tr>
    </table>

</html>
